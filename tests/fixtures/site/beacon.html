<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page that tries to post by itself</title>
</head>
<body>
<form id="f" method="post" action="/collect">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <button type="submit">Send</button>
</form>
<script>
  fetch('/collect', { method: 'POST', body: 'from-script' }).catch(() => {});
  navigator.sendBeacon && navigator.sendBeacon('/collect', 'beacon');
  document.getElementById('email').addEventListener('paste', (e) => e.preventDefault());
</script>
</body>
</html>
