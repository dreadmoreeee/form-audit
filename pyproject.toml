[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "form-audit"
version = "1.0.0"
description = "Read-only audit of web forms: labels, autocomplete tokens, mobile keyboards, error wiring, password fields and touch targets."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia" }]
requires-python = ">=3.10"
dependencies = ["playwright>=1.40"]
keywords = ["forms", "accessibility", "autocomplete", "wcag", "audit", "playwright"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
form-audit = "form_audit.cli:main"

[project.urls]
Homepage = "https://github.com/dreadmoreeee/form-audit"

[tool.setuptools]
packages = ["form_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
